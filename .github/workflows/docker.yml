name: Docker - Build e publicação

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mateusmendes0/atividadedevops
  IMAGE_VERSION: "1.0"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Construir a imagem Docker
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}" \
            .

      - name: Verificar se a imagem foi criada
        run: docker image inspect "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem no registry
        run: docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
