name: Docker - Build e publicação

on:
  push:
    branches:
      - main
      - feat/devsecops
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mateusmendes0/atividadedevops
  IMAGE_VERSION: "2.0"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código e o histórico completo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detectar secrets no histórico
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: >-
            git . --log-opts=--all --redact=100 --verbose --no-banner
            --exit-code=1 --timeout=300
            --report-format=json --report-path=gitleaks-report.json

      - name: Salvar relatório do Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 14

  build-and-push:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Construir a imagem Docker
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}" \
            .

      - name: Verificar se a imagem foi criada
        run: docker image inspect "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"

      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem no registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
